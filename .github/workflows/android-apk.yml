name: Android APK — REQ N GO
on:
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main, feature/reqngo-android-apk-v1]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Vérifier les règles de sûreté (Java pur)
        run: |
          mkdir -p /tmp/reqngo-tests
          javac -d /tmp/reqngo-tests android-app/app/src/main/java/com/reqngo/manager/ClanTag.java android-app/app/src/main/java/com/reqngo/manager/RequestJournal.java android-app/tests/FlowChecks.java
          java -cp /tmp/reqngo-tests FlowChecks
      - name: SDK Android du runner
        run: |
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compiler l'APK
        run: gradle -p android-app --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: reqngo-android-apk-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
