name: Core CI

on:
  push:
    branches: [windows/core-port, feature/intelligence-v2]
  pull_request:

jobs:
  lightweight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Test lightweight core packages
        run: |
          go test ./internal/config
          go test ./internal/telemetry
          go test ./internal/intelligence
          go test ./cmd/account_proxy

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Validate frontend TSX syntax
        working-directory: web
        shell: bash
        run: |
          npm ci
          rm -rf .syntax-check
          mkdir -p .syntax-check
          find src -type f \( -name '*.ts' -o -name '*.tsx' \) -print0 | while IFS= read -r -d '' file; do
            out=".syntax-check/${file//\//_}.js"
            npx --no-install esbuild "$file" --format=esm --platform=browser --external:* --outfile="$out" >/dev/null
          done
          rm -rf .syntax-check

      # The Windows Beta workflow remains authoritative for generated Wails
      # bindings, full TypeScript/Vite type checking, GoCV/OpenCV and packaging.
      # The esbuild pass above deliberately marks imports external: it is a fast
      # syntax guard that catches malformed TS/TSX before waiting for Windows.
