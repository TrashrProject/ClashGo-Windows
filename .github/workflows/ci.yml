name: Core CI

on:
  push:
    branches: [windows/core-port, feature/intelligence-v2]
  pull_request:

jobs:
  lightweight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Test lightweight core packages
        run: |
          go test ./internal/config
          go test ./internal/telemetry
          go test ./internal/intelligence
          go test ./cmd/account_proxy

      # The repository's existing Windows Build workflow is authoritative for
      # Wails binding generation, TypeScript/Vite, GoCV/OpenCV tests and the
      # packaged EXE. Running web/tsc directly here would be invalid because
      # web/wailsjs/go/main/App is generated by Wails and intentionally is not
      # committed.
