name: Core CI

on:
  push:
    branches: [windows/core-port, feature/intelligence-v2]
  pull_request:

jobs:
  lightweight:
    # feature/intelligence-v2 already runs this exact Core CI on push.
    # Skip the duplicate pull_request invocation for that branch only.
    if: ${{ github.event_name != 'pull_request' || github.head_ref != 'feature/intelligence-v2' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Test lightweight core packages
        run: |
          go test ./internal/config
          go test ./internal/telemetry
          go test ./internal/intelligence
          go test ./internal/licensing
          go test ./internal/support
          go test ./internal/updater
          go test ./internal/paths
          go test ./cmd/account_proxy

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Validate Cloudflare control API syntax
        run: node --check cloudflare/worker/src/index.js

      - name: Validate Wails frontend contract
        run: node tools/check-wails-contract.mjs

      - name: Validate frontend TSX syntax
        working-directory: web
        shell: bash
        run: |
          npm ci
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import ts from 'typescript';

          const files = [];
          const walk = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && /\.tsx?$/.test(entry.name) && !entry.name.endsWith('.d.ts')) files.push(full);
            }
          };
          walk('src');

          let failed = false;
          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            const result = ts.transpileModule(source, {
              fileName: file,
              reportDiagnostics: true,
              compilerOptions: {
                jsx: ts.JsxEmit.ReactJSX,
                target: ts.ScriptTarget.ES2020,
                module: ts.ModuleKind.ESNext,
              },
            });
            for (const diagnostic of result.diagnostics || []) {
              if (diagnostic.category !== ts.DiagnosticCategory.Error) continue;
              failed = true;
              const message = ts.flattenDiagnosticMessageText(diagnostic.messageText, '\n');
              if (diagnostic.file && typeof diagnostic.start === 'number') {
                const pos = diagnostic.file.getLineAndCharacterOfPosition(diagnostic.start);
                console.error(`${file}:${pos.line + 1}:${pos.character + 1} ${message}`);
              } else {
                console.error(`${file}: ${message}`);
              }
            }
          }
          if (failed) process.exit(1);
          console.log(`TS/TSX syntax OK: ${files.length} files`);
          NODE

      - name: Build frontend
        working-directory: web
        run: npm run build

      # The Windows Beta workflow remains authoritative for generated Wails
      # bindings regeneration, GoCV/OpenCV and Windows packaging. Core CI now
      # also executes the real frontend build so type/import regressions fail
      # quickly without waiting for the heavy Windows runner.
