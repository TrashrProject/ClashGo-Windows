name: Core CI

on:
  push:
    branches: [windows/core-port, feature/intelligence-v2]
  pull_request:

jobs:
  lightweight:
    # feature/intelligence-v2 already runs this exact Core CI on push.
    # Skip the duplicate pull_request invocation for that branch only.
    if: ${{ github.event_name != 'pull_request' || github.head_ref != 'feature/intelligence-v2' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.x'
          cache: true

      - name: Test lightweight core packages
        run: |
          go test ./internal/config
          go test ./internal/telemetry
          go test ./internal/intelligence
          go test ./internal/multiaccount
          go test ./internal/licensing
          go test ./internal/support
          go test ./internal/updater
          go test ./internal/paths
          go test ./cmd/account_proxy

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Validate Cloudflare control API syntax
        run: node --check cloudflare/worker/src/index.js

      - name: Validate Wails frontend contract
        run: node tools/check-wails-contract.mjs

      - name: Guard UI runtime identifiers from translation
        run: node tools/check-ui-localization-safety.mjs

      - name: Validate control API parity
        run: node tools/check-control-api-parity.mjs

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            "build/windows/install_update.ps1",
            "tools/run-control-local.ps1",
            "tools/create-local-admin-license.ps1"
          )
          foreach ($file in $files) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$null,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              Write-Host "PowerShell syntax errors in $file" -ForegroundColor Red
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
            Write-Host "PowerShell syntax OK: $file"
          }
          Write-Host "Updater PowerShell syntax OK."

      - name: Validate frontend TSX syntax
        working-directory: web
        shell: bash
        run: |
          npm ci
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import ts from 'typescript';

          const files = [];
          const walk = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && /\.tsx?$/.test(entry.name) && !entry.name.endsWith('.d.ts')) files.push(full);
            }
          };
          walk('src');

          let failed = false;
          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            const result = ts.transpileModule(source, {
              fileName: file,
              reportDiagnostics: true,
              compilerOptions: {
                jsx: ts.JsxEmit.ReactJSX,
                target: ts.ScriptTarget.ES2020,
                module: ts.ModuleKind.ESNext,
              },
            });
            for (const diagnostic of result.diagnostics || []) {
              if (diagnostic.category !== ts.DiagnosticCategory.Error) continue;
              failed = true;
              const message = ts.flattenDiagnosticMessageText(diagnostic.messageText, '\n');
              if (diagnostic.file && typeof diagnostic.start === 'number') {
                const pos = diagnostic.file.getLineAndCharacterOfPosition(diagnostic.start);
                console.error(`${file}:${pos.line + 1}:${pos.character + 1} ${message}`);
              } else {
                console.error(`${file}: ${message}`);
              }
            }
          }
          if (failed) process.exit(1);
          console.log(`TS/TSX syntax OK: ${files.length} files`);
          NODE

      - name: Generate lightweight Wails CI bindings
        run: node tools/generate-wails-ci-stub.mjs

      - name: Build frontend
        working-directory: web
        run: npm run build

      # The Windows Beta workflow remains authoritative for generated Wails
      # bindings regeneration, GoCV/OpenCV and Windows packaging. Core CI now
      # also executes the real frontend build so type/import regressions fail
      # quickly without waiting for the heavy Windows runner.
