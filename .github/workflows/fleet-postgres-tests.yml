name: Fleet PostgreSQL tests

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  postgres-fleet:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fleet_ci
          POSTGRES_USER: fleet_test
          POSTGRES_PASSWORD: local-ci-password-not-for-production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleet_test -d fleet_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt httpx
      - name: Real PostgreSQL fleet integration
        env:
          # The dedicated CI database is disposable and has no user data.
          FLEET_TEST_PG_DSN: postgresql://fleet_test:local-ci-password-not-for-production@127.0.0.1:5432/fleet_ci
        run: python -m unittest tests.test_postgres_fleet -v
      - name: Synthetic multi-worker throughput benchmark
        env:
          FLEET_TEST_PG_DSN: postgresql://fleet_test:local-ci-password-not-for-production@127.0.0.1:5432/fleet_ci
          FLEET_BENCH_DISPOSABLE: "1"
        run: python -m tools.fleet_load_benchmark --profiles 5000 --jobs 1200 --workers 6
      - name: Store sanitized benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-v13-benchmark-${{ github.run_id }}
          path: artifacts/fleet-benchmark.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Compile worker modules
        run: python -m compileall -q reqngo tools

  compose-end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Values are isolated, disposable CI credentials, never production keys.
      GUARDIAN_PASSWORD: ci-v10-admin-passphrase-local-only-2026
      GUARDIAN_AGENT_TOKEN: ci-v10-telemetry-token-local-12345678901234567890
      FLEET_DB_PASSWORD: ci-v10-database-secret-local-only-123456
      FLEET_WORKER_01_TOKEN: ci-v10-worker-one-key-111111111111111111111
      FLEET_WORKER_02_TOKEN: ci-v10-worker-two-key-222222222222222222222
    steps:
      - uses: actions/checkout@v4
      - name: Validate distributed demo Compose
        run: docker compose -f compose.fleet-demo.yaml config --quiet
      - name: Launch Guardian/PostgreSQL/two workers
        run: docker compose -f compose.fleet-demo.yaml up --build -d
      - name: End-to-end distributed diagnostic workflow
        run: python tools/fleet_compose_smoke.py
      - name: Diagnostic status if test fails
        if: failure()
        run: |
          docker compose -f compose.fleet-demo.yaml ps
          docker compose -f compose.fleet-demo.yaml logs --tail=50 guardian postgres fleet01 fleet02
      - name: Stop disposable CI environment
        if: always()
        run: docker compose -f compose.fleet-demo.yaml down -v
