name: Guardian tests

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt httpx -r requirements-android.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate three-service Compose topology
        env:
          GUARDIAN_PASSWORD: github-ci-password-not-used-for-login
          GUARDIAN_AGENT_TOKEN: github-ci-token-not-used-in-deployment-123
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.cloud.yaml config --quiet
      - name: Compile modules
        run: python -m compileall -q reqngo tools
      - name: Run four real Docker processes
        env:
          GUARDIAN_PASSWORD: ci-only-passphrase-not-for-production
          GUARDIAN_AGENT_TOKEN: ci-only-agent-token-not-for-production-123456
        run: |
          docker compose up --build -d
          python tools/compose_smoke.py
      - name: Preserve sanitized pilot diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardian-diagnostics-${{ github.run_id }}
          path: artifacts/guardian-smoke.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Inspect Docker logs on failure
        if: failure()
        env:
          GUARDIAN_PASSWORD: ci-only-passphrase-not-for-production
          GUARDIAN_AGENT_TOKEN: ci-only-agent-token-not-for-production-123456
        run: |
          docker compose ps
          docker compose logs --tail=70 guardian pilot01 pilot02 pilot03
      - name: Clean up Docker test
        if: always()
        env:
          GUARDIAN_PASSWORD: ci-only-passphrase-not-for-production
          GUARDIAN_AGENT_TOKEN: ci-only-agent-token-not-for-production-123456
        run: docker compose down -v
