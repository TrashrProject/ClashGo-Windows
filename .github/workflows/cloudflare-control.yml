name: Deploy ClashGO Control API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clashgo-control-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLASHGO_ADMIN_KEY: ${{ secrets.CLASHGO_ADMIN_KEY }}
      D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/intelligence-v2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLASHGO_ADMIN_KEY" || { echo "Missing CLASHGO_ADMIN_KEY"; exit 1; }
          test -n "$D1_DATABASE_ID" || { echo "Missing CLOUDFLARE_D1_DATABASE_ID"; exit 1; }

      - name: Install Wrangler
        run: npm install

      - name: Inject D1 database id
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          p = Path("wrangler.jsonc")
          s = p.read_text(encoding="utf-8")
          s = s.replace("REPLACE_WITH_D1_DATABASE_ID", os.environ["D1_DATABASE_ID"])
          p.write_text(s, encoding="utf-8")
          PY

      - name: Apply D1 schema
        run: npx wrangler d1 execute clashgo-control --remote --file=./schema.sql

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Configure admin secret
        shell: bash
        run: printf '%s' "$CLASHGO_ADMIN_KEY" | npx wrangler secret put CLASHGO_ADMIN_KEY
