name: Guardian image

on:
  push:
    branches: [main]
    paths:
      - "reqngo/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/guardian-image.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install -r requirements.txt httpx
          python -m unittest discover -s tests -v
          python -m compileall -q reqngo tools

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/trashrproject/clashgo-windows:main
            ghcr.io/trashrproject/clashgo-windows:sha-${{ github.sha }}
