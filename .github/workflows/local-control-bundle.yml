name: Local Control Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - feature/intelligence-v2
    paths:
      - 'cmd/account_proxy/**'
      - 'tools/start-local-control-binary.ps1'
      - '.github/workflows/local-control-bundle.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/intelligence-v2

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.x'
          cache: true

      - name: Test control server
        run: go test ./cmd/account_proxy

      - name: Build Windows control server
        shell: bash
        run: |
          mkdir -p dist/local-control
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/local-control/clashgo-control-local.exe ./cmd/account_proxy
          cp tools/start-local-control-binary.ps1 dist/local-control/START-LOCAL-CONTROL.ps1
          cat > dist/local-control/START-LOCAL-CONTROL.cmd <<'CMD'
          @echo off
          cd /d "%~dp0"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\START-LOCAL-CONTROL.ps1"
          if errorlevel 1 pause
          CMD
          cat > dist/local-control/README.txt <<'TXT'
          ClashGO Control Local Portable

          1. Double-clique START-LOCAL-CONTROL.cmd
          2. Une licence ADMIN locale est générée et copiée dans le presse-papiers.
          3. Dans la beta ClashGO : Mon ClashGO > Mode test bêta.
          4. Serveur : http://127.0.0.1:8787
          5. Active ensuite la licence ADMIN affichée.

          Ce bundle sert uniquement aux tests locaux de la beta.
          TXT

      - name: Package bundle
        shell: bash
        run: |
          cd dist
          zip -r ClashGO-Local-Control-Windows.zip local-control
          sha256sum ClashGO-Local-Control-Windows.zip > SHA256SUMS-local-control.txt

      - name: Replace rolling local-control release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete control-local-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create control-local-latest \
            dist/ClashGO-Local-Control-Windows.zip \
            dist/SHA256SUMS-local-control.txt \
            --target "${{ github.sha }}" \
            --title "ClashGO Local Control Windows" \
            --notes "Portable local license/control server for ClashGO beta testing. Double-click START-LOCAL-CONTROL.cmd after extracting."

      - name: Upload bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ClashGO-Local-Control-Windows
          path: |
            dist/local-control/**
            dist/ClashGO-Local-Control-Windows.zip
            dist/SHA256SUMS-local-control.txt
          if-no-files-found: error
