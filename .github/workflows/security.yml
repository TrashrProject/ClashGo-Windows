name: Security Audit

on:
  push:
    branches:
      - windows/core-port
      - feature/intelligence-v2
  pull_request:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-and-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.x'
          cache: true

      - name: Go vet lightweight control plane
        run: |
          go vet ./internal/config ./internal/telemetry ./internal/intelligence ./internal/multiaccount ./internal/licensing ./internal/support ./internal/updater ./internal/paths ./cmd/account_proxy

      - name: Go vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./internal/config ./internal/telemetry ./internal/intelligence ./internal/multiaccount ./internal/licensing ./internal/support ./internal/updater ./internal/paths ./cmd/account_proxy

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./internal/config ./internal/telemetry ./internal/intelligence ./internal/multiaccount ./internal/licensing ./internal/support ./internal/updater ./internal/paths ./cmd/account_proxy

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Frontend dependency audit
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Cloudflare Worker dependency audit
        working-directory: cloudflare/worker
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit --audit-level=high

  codeql:
    name: CodeQL JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Generate repository SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          output-file: clashgo-sbom.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ClashGO-SBOM
          path: clashgo-sbom.spdx.json
          if-no-files-found: error
