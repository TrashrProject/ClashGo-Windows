name: Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v
        required: true
        default: 0.6.0-windows-beta
      notes:
        description: Release notes
        required: false
        default: Windows BlueStacks 5 port beta

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Windows branch
        uses: actions/checkout@v4
        with:
          ref: windows/core-port
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install MinGW and CMake
        shell: powershell
        run: choco install mingw cmake -y --no-progress

      - name: Restore cached OpenCV
        id: opencv-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\opencv\build\install
          key: opencv-4.13.0-mingw-gocv043-v2

      - name: Build OpenCV 4.13 for GoCV
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          git clone --depth 1 --branch v0.43.0 https://github.com/hybridgroup/gocv.git "$env:RUNNER_TEMP\gocv"
          Push-Location "$env:RUNNER_TEMP\gocv"
          cmd /c win_download_opencv.cmd
          if ($LASTEXITCODE -ne 0) { throw "OpenCV download failed" }
          (Get-Content .\win_build_opencv.cmd -Raw).Replace("-DBUILD_PERF_TESTS=ON", "-DBUILD_PERF_TESTS=OFF") | Set-Content .\win_build_opencv.cmd -Encoding ASCII
          $env:CMAKE_BUILD_PARALLEL_LEVEL = [Environment]::ProcessorCount
          Write-Host "Building OpenCV with $env:CMAKE_BUILD_PARALLEL_LEVEL parallel jobs"
          cmd /c win_build_opencv.cmd
          if ($LASTEXITCODE -ne 0) { throw "OpenCV build failed" }
          Pop-Location

      - name: Save OpenCV cache immediately
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\opencv\build\install
          key: opencv-4.13.0-mingw-gocv043-v2

      - name: Add OpenCV to PATH
        shell: powershell
        run: |
          "C:\opencv\build\install\x64\mingw\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Wails
        shell: powershell
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Synchronize audited runtime assets
        shell: powershell
        run: .\tools\sync-upstream-runtime.ps1

      - name: Test
        shell: powershell
        run: go test ./internal/... ./pkg/...

      - name: Build
        shell: powershell
        run: .\tools\build-windows.ps1 -Version "${{ inputs.version }}" -SkipSync -SkipTests

      - name: Generate update manifest
        id: manifest
        shell: powershell
        run: |
          $version = "${{ inputs.version }}"
          $zip = Get-ChildItem dist -Filter "ClashGO-v$version-windows.zip" | Select-Object -First 1
          if (-not $zip) { throw "Release ZIP not found" }
          $sha = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          $size = $zip.Length
          $assetName = $zip.Name
          $assetUrl = "https://github.com/TrashrProject/ClashGo-Windows/releases/download/v$version/$assetName"
          $manifest = [ordered]@{
            version = $version
            release_date = (Get-Date).ToUniversalTime().ToString("o")
            notes = "${{ inputs.notes }}"
            min_supported = "0.6.0-windows-beta"
            platforms = [ordered]@{
              windows = [ordered]@{
                asset_name = $assetName
                asset_url = $assetUrl
                size = $size
                sha256 = $sha
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content dist\latest.json -Encoding UTF8
          "zip=$($zip.FullName)" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ inputs.version }}"
          $zip = "${{ steps.manifest.outputs.zip }}"
          gh release create "v$version" "$zip" "dist\latest.json" --repo TrashrProject/ClashGo-Windows --title "ClashGO Windows v$version" --notes "${{ inputs.notes }}" --target windows/core-port
