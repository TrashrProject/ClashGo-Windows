name: "Valkyrie Quake Farm"
description: "Alternative ground-farm profile inspired by ClashCore: Earthquakes open the path, Valkyries sweep a single verified side, then heroes and Rage follow. It remains opt-in and uses ClashGO's existing live troop-bar detection, safe deploy corridor and End Battle verification."
target_edge: "Random"
end_at_percent: 50
auto_deploy_eventTroops: true
phases:
  - name: "Earthquake"
    units:
      - { name: "Earthquake Spell", amount: "All" }
    pattern: "Point"
    position: "Center"
    offset: 28
    retry: 2
    verify_before_next: true
    delay_after_ms: 120

  - name: "Valkyries"
    units:
      - { name: "Valkyrie", amount: "All" }
    pattern: "Line"
    offset: 55
    retry: 3
    verify_before_next: true
    delay_after_ms: 80

  - name: "Heroes"
    units:
      - { name: "Barbarian King", amount: "All" }
      - { name: "Archer Queen", amount: "All" }
      - { name: "Grand Warden", amount: "All" }
      - { name: "Royal Champion", amount: "All" }
    pattern: "Point"
    position: "Center"
    offset: 42
    retry: 2
    delay_after_ms: 80

  - name: "Rage"
    units:
      - { name: "Rage Spell", amount: "All" }
    pattern: "Point"
    position: "Center"
    offset: 30
    retry: 2
    delay_after_ms: 80
