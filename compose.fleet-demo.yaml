# Opt-in local distributed fleet demo. No game accounts, game control or paid hosting.
# Start only after supplying secrets via a NON-versioned .env file.
x-fleet-worker: &fleet-worker
  build: .
  restart: unless-stopped
  depends_on:
    guardian:
      condition: service_healthy
  environment:
    GUARDIAN_URL: http://guardian:8765
    GUARDIAN_PRIVATE_DOCKER: "1"
    FLEET_WORKER_CAPACITY: "2"
    FLEET_POLL_SECONDS: "5"
    FLEET_WORKDIR: /data
  healthcheck:
    test: ["CMD", "python", "-m", "reqngo.health", "worker"]
    interval: 45s
    timeout: 6s
    retries: 3
    start_period: 40s

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: ${FLEET_DB_PASSWORD:?Set a unique database secret}
    volumes:
      - fleet-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      timeout: 5s
      retries: 10

  guardian:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GUARDIAN_PASSWORD: ${GUARDIAN_PASSWORD:?Set a unique admin secret}
      GUARDIAN_AGENT_TOKEN: ${GUARDIAN_AGENT_TOKEN:?Set a separate telemetry secret}
      GUARDIAN_DATA_DIR: /data
      FLEET_DATABASE_URL: postgresql://fleet@postgres:5432/fleet
      PGPASSWORD: ${FLEET_DB_PASSWORD:?Set a unique database secret}
      FLEET_WORKER_TOKENS_JSON: '{"fleet_01":"${FLEET_WORKER_01_TOKEN:?Set first worker secret}","fleet_02":"${FLEET_WORKER_02_TOKEN:?Set second worker secret}"}'
    ports:
      - "127.0.0.1:8765:8765"
    healthcheck:
      test: ["CMD", "python", "-m", "reqngo.health", "guardian"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 40s
    volumes:
      - guardian-data:/data

  fleet01:
    <<: *fleet-worker
    command: ["python", "-m", "reqngo.fleet_worker"]
    environment:
      GUARDIAN_URL: http://guardian:8765
      GUARDIAN_PRIVATE_DOCKER: "1"
      FLEET_WORKER_ID: fleet_01
      FLEET_WORKER_TOKEN: ${FLEET_WORKER_01_TOKEN:?Set first worker secret}
      FLEET_WORKER_CAPACITY: "2"
      FLEET_POLL_SECONDS: "5"
      FLEET_WORKDIR: /data
    volumes:
      - fleet01-data:/data

  fleet02:
    <<: *fleet-worker
    command: ["python", "-m", "reqngo.fleet_worker"]
    environment:
      GUARDIAN_URL: http://guardian:8765
      GUARDIAN_PRIVATE_DOCKER: "1"
      FLEET_WORKER_ID: fleet_02
      FLEET_WORKER_TOKEN: ${FLEET_WORKER_02_TOKEN:?Set second worker secret}
      FLEET_WORKER_CAPACITY: "2"
      FLEET_POLL_SECONDS: "5"
      FLEET_WORKDIR: /data
    volumes:
      - fleet02-data:/data

volumes:
  fleet-postgres-data:
  guardian-data:
  fleet01-data:
  fleet02-data:
